<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login · Sandbox Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 6rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 1.5rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; box-sizing: border-box; }
    button { margin-top: 1.5rem; width: 100%; background: #1a2540; color: #fff; padding: 0.6rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; }
    .error { color: #b00020; margin-top: 0.75rem; font-size: 0.9rem; }
    .hint { color: #888; font-size: 0.8rem; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <h1>Sandbox Notes</h1>
  <form method="POST">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <button type="submit">Log in</button>
  </form>
  <p class="hint">Demo credentials: <strong>admin</strong> / <strong>password123</strong></p>
</body>
</html>

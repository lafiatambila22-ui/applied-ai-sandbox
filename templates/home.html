<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sandbox Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; margin-bottom: 1.5rem; }
    .note { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .note h3 { margin: 0 0 0.5rem; }
    a.btn { display: inline-block; background: #1a2540; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1 style="margin:0;">Sandbox Notes</h1>
    <form method="POST" action="{{ url_for('logout') }}" style="margin:0;">
      <span style="color:#666; margin-right:0.75rem;">{{ username }}</span>
      <button type="submit" style="background:none; border:1px solid #ccc; border-radius:6px; padding:0.3rem 0.75rem; cursor:pointer;">Log out</button>
    </form>
  </div>
  <p class="meta">A tiny note-taking app. Practice ground for the Applied AI cohort.</p>

  <a class="btn" href="{{ url_for('new_note') }}">+ New note</a>

  <h2 style="margin-top: 2rem;">Your notes ({{ notes|length }})</h2>
  {% if notes %}
    {% for note in notes %}
      <div class="note" style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <h3>{{ note.title }}</h3>
          <p>{{ note.body }}</p>
        </div>
        <form method="POST" action="{{ url_for('delete_note', idx=loop.index0) }}" style="margin:0;">
          <button type="submit" style="background:none; border:1px solid #ddd; border-radius:6px; padding:0.25rem 0.6rem; cursor:pointer; color:#b00020;">Delete</button>
        </form>
      </div>
    {% endfor %}
  {% else %}
    <p>No notes yet.</p>
  {% endif %}
</body>
</html>
